name: Inspect Crown Rush VPS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crown-rush-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployment credential
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo 'Add the VPS_SSH_PASSWORD repository secret before running this workflow.'
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install SSH password support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Inspect web server without changing configuration
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          sshpass -e ssh \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -o StrictHostKeyChecking=accept-new \
            root@5.189.166.219 'bash -s' < scripts/inspect-vps.sh
